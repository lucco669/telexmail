[workspace]
resolver = "2"
members = ["crates/telex-core", "crates/telex-security", "src-tauri"]
exclude = ["vendor/glib", "fuzz"]

# GTK 0.18 requires GLib 0.18. Keep its API and backport the upstream iterator fix.
[patch.crates-io]
glib = { path = "vendor/glib" }

[workspace.package]
version = "0.9.5"
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
