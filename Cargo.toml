[workspace]
resolver = "2"
members = ["crates/telex-core", "crates/telex-i18n", "crates/telex-security", "src-tauri"]
exclude = ["vendor/glib", "fuzz"]

# GTK 0.18 requires GLib 0.18. Keep its API and backport the upstream iterator fix.
[patch.crates-io]
glib = { path = "vendor/glib" }

[workspace.package]
version = "0.9.23"
edition = "2021"
rust-version = "1.90"
# Not open source: all rights reserved (LICENSE); the app is free to use (EULA.txt).
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# Making a picture smaller takes seconds unoptimized; optimized even in dev builds and tests.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
