[package]
name = "telex-core"
description = "Mail engine for Telex: accounts, folders, messages, SQLite mail base and IMAP sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "functions"] }
mail-parser = "0.11.9"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1.53.2", features = ["net", "time", "rt", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.9"
futures-util = "0.3.34"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
ammonia = "4.2.1"
ureq = "3.4.2"
base64 = "0.22"

# MX and SRV lookups for the add-account wizard, through Windows' own DNS resolver, and
# Windows' display languages for the interface language.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_Dns"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros", "io-util"] }
