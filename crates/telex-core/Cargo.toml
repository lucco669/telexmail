[package]
name = "telex-core"
description = "Mail engine for Telex: accounts, folders, messages, SQLite mail base and IMAP sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
telex-i18n = { path = "../telex-i18n" }
chrono.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled", "chrono", "functions"] }
mail-parser = "0.11.9"
# Fast byte searches (SIMD): looking for a calendar in every stored message after an upgrade.
# Already here through regex and others.
memchr = "2.8"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1.53.2", features = ["net", "time", "rt", "io-util", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.9"
futures-util = "0.3.34"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
ammonia = "4.2.3"
html5ever = "0.40.1"
url = "2.5"
idna = "1.1"
# An embedded suffix list for domain comparisons, including co.uk and hosting tenants.
# This is not a reputation service and makes no network requests.
psl = "2.1"
ureq = "3.4.2"
base64 = "0.22"
# Moving in from Outlook: its data files (.pst), read with Microsoft's reader of the MS-PST
# specification, and single messages (.msg), which are compound files (the Tauri app already
# has this cfb for file types).
outlook-pst = "1.2.0"
cfb = "0.14.0"
# Spelling with Hunspell dictionaries (LibreOffice's, the system's), read in Rust, and the
# SHA-256 a fetched dictionary must match (ring is here for TLS already).
spellbook = "0.4.2"
ring = "0.17"
# Rules' "matches pattern": regular expressions in linear time (no backtracking), and their
# parser on its own, to say where a mistyped pattern goes wrong.
regex = "1.13.1"
regex-syntax = "0.8.11"
# Calendar invitations: the IANA time zones (and Windows' names mapped to them), compiled in,
# so an invite shows in local time without a system database.
chrono-tz = "0.10.4"
# Pictures put into a message being written: read, turned upright and made smaller. Only PNG,
# JPEG, GIF and WebP are compiled in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# OpenPGP (openpgp.rs): rPGP, pure Rust, MIT or Apache-2.0 (Sequoia is LGPL, so not it). No
# BZip2 (rare in mail). rand 0.8 is the one rPGP takes; rsa only names an RSA key's size
# (rPGP brings it).
pgp = { version = "0.21.0", default-features = false }
rand = "0.8.5"
rsa = { version = "0.9.10", features = ["sha2"] }
smallvec = "1.10"
# S/MIME (smime.rs): RustCrypto's CMS, X.509 and PKCS #12, MIT or Apache-2.0, of the same
# generation (der 0.7) as the rsa crate rPGP brings. PKCS #12 files are encrypted with PBES2
# (AES) or, from older Windows and OpenSSL, with 3DES and RC2: hence des and rc2. A
# certificate's chain is checked by Windows itself (CryptoAPI) and elsewhere by rustls-webpki
# (ISC, here for TLS already) against the system's certificates.
cms = { version = "0.2.3", features = ["builder"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "pem"] }
der = { version = "0.7.10", features = ["std", "pem"] }
spki = { version = "0.7.3", features = ["std"] }
const-oid = { version = "0.9.6", features = ["db"] }
pkcs12 = { version = "0.1.0", features = ["kdf"] }
pkcs5 = { version = "0.7.1", features = ["pbes2", "3des", "sha1-insecure"] }
pkcs8 = { version = "0.10.2", features = ["encryption", "std"] }
hmac = "0.12.1"
zeroize = "1.8"
sha1 = "0.10.6"
sha2 = "0.10.9"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["std"] }
des = "0.8.1"
rc2 = "0.8.1"
p256 = { version = "0.13.2", features = ["ecdsa"] }
p384 = { version = "0.13.1", features = ["ecdsa"] }
signature = "2.2.0"
webpki = { package = "rustls-webpki", version = "0.103.15", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.15.1"

# MX and SRV lookups for the add-account wizard, through Windows' own DNS resolver;
# Windows' display languages for the interface language; Outlook's accounts in the registry.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_Dns", "Win32_Security_Cryptography", "Win32_System_Registry"] }
# Windows' own spell checker, a COM object (the same windows crate WebView2 brings in).
windows = { version = "0.62.2", features = ["Win32_Globalization", "Win32_System_Com"] }

# MX and SRV lookups elsewhere (Linux, macOS): a DNS client in Rust that reads the system's DNS
# servers from /etc/resolv.conf. Plain DNS only, no DNS over TLS or HTTPS.
[target.'cfg(not(windows))'.dependencies]
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
# S/MIME: the system's certificate authorities (/etc/ssl/certs and the like), for chains.
rustls-native-certs = "0.8.4"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros", "io-util"] }
# Writes Outlook data files for the tests: a fork of outlook-pst that can create them.
pst_fixture = { package = "outlook-pst-rw", version = "1.2.9" }
