[package]
name = "telex"
description = "Telex: a compact, keyboard-driven email client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "telex_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
telex-core = { path = "../crates/telex-core" }
# tray-icon: the notification area icon and its menu (tray.rs; AppIndicator on Linux).
tauri = { version = "2", features = ["tray-icon"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tauri-plugin-opener = "2.5.5"
# One Telex at a time on a mail base; a second start brings the first one forward.
tauri-plugin-single-instance = "2.5.3"
# Save and Open dialogs (settings files, attachments), called from Rust only.
tauri-plugin-dialog = "2.7.3"
# A system notification for new mail while the window isn't active, sent from Rust only.
tauri-plugin-notification = "2.4.0"
# Every account's check at the same time (join_all over borrowed state).
futures-util = "0.3.34"
# The pause before mail that can still be undone goes out, and between IDLE reconnects.
tokio = { version = "1.53.2", features = ["time", "sync"] }
# Updates from GitHub Releases. Without the zip feature: it only unpacks Tauri v1 bundles.
tauri-plugin-updater = { version = "2.13.2", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Passwords in the system's own store (secrets.rs), one backend per system.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
# Save as PDF through WebView2's own PrintToPdf, and messages dragged out as files through the
# shell's drag: the same webview2-com and windows crates Tauri already uses.
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

# The Secret Service over D-Bus: GNOME Keyring, KWallet, KeePassXC. Building needs libdbus-1-dev.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
# Messages dragged out of the window as files, through GTK's drag (the GTK Tauri already uses).
gtk = "0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
