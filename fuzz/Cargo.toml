[package]
name = "telex-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
telex-core = { path = "../crates/telex-core" }

[workspace]
members = ["."]

[[bin]]
name = "mime_html"
path = "fuzz_targets/mime_html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pst_import"
path = "fuzz_targets/pst_import.rs"
test = false
doc = false
bench = false
