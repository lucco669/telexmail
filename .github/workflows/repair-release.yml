name: Repair release

# By hand: Actions > Repair release > Run workflow. Moves the files a release build left in a
# second draft with the same tag (0.8.0's and 0.8.1's Linux builds finished after the draft had
# been published) onto the published release, adds them to its latest.json and removes that
# draft. See scripts/repair-release.mjs.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag, e.g. v0.8.1 (empty: every published release that has such a draft)'
        required: false
        default: ''
      dry_run:
        description: 'Only say what would change'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  repair:
    name: Repair release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: node scripts/repair-release.mjs ${TAG:+"$TAG"} $DRY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          DRY: ${{ inputs.dry_run && '--dry-run' || '' }}
