name: Release

# Pushing a tag like v0.2.0 makes a draft GitHub release, then builds the signed Windows
# installers, the Linux AppImage and .deb, and the updater's latest.json into it. Publishing
# the draft is what makes the update reach Telex. The whole process is in docs/releasing.md.
#
# Needs, under Settings > Secrets and variables > Actions:
#   secret   TAURI_SIGNING_PRIVATE_KEY           the private key (contents of the .key file)
#   secret   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   variable TELEX_UPDATER_PUBKEY                the public key (contents of the .key.pub file)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The draft release comes first, and both builds upload to it by its id. Left to find it by
  # the tag, tauri-action looks only for a draft: a build that finished after the draft had been
  # published made a second draft of its own (0.8.0's and 0.8.1's Linux files). By its id, the
  # files land on the release, published or not.
  #
  # Actions are pinned to commits (the tag in a comment): a tag moved later can't change what
  # runs next to the signing key.
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Check the tag matches the version
        run: node scripts/set-version.mjs --check "$GITHUB_REF_NAME"

      # An annotated tag's message becomes the release notes, on GitHub and in Telex's update
      # dialog. Checkout leaves the tag as a plain ref, so fetch the tag object itself.
      - name: Release notes from the tag
        id: notes
        run: |
          git fetch --force --depth=1 origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            notes="$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME")"
          fi
          {
            echo 'body<<TELEX_NOTES_END'
            printf '%s\n' "$notes"
            echo 'TELEX_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      # On "Re-run all jobs" the release this tag already has is used again, the published one
      # before a draft.
      - name: The draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | sort_by(.draft) | .[0].id // empty")"
          if [ -z "$id" ]; then
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
              -f name="Telex ${GITHUB_REF_NAME#v}" -f body="$NOTES" -F draft=true -F prerelease=false --jq .id)"
            echo "Made the draft release $id."
          else
            echo "Using release $id, which this tag already has."
          fi
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.name }}
    needs: draft
    # One system at a time: each adds its files and its platforms to the release's latest.json
    # (tauri-action reads the file, adds to it and uploads it again), so two at once could each
    # drop the other's platforms. A failed Linux build doesn't stop the Windows one.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: Windows release
            os: windows-latest
          # The oldest Ubuntu GitHub offers: an AppImage runs on systems whose C library is as
          # new as the build system's or newer.
          - name: Linux release
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      # Compiled into the app (option_env! in src-tauri/src/updates.rs): without it the build
      # can't update itself. A repository variable, or a secret if it was added as one.
      TELEX_UPDATER_PUBKEY: ${{ vars.TELEX_UPDATER_PUBKEY || secrets.TELEX_UPDATER_PUBKEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      # What Tauri 2 builds against on Linux, and D-Bus for the password store (keyring).
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable # read from the ref when not pinned
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: npm ci

      # Pasting into the secrets form easily adds a line break, and Tauri can't read a key with
      # one. The key is base64, so whitespace in it is never meant; a password can't contain a
      # line break. The key, cleaned, goes into a file that only the two steps that sign are told
      # about (the bundler takes a path as well as the key), not into every later step's
      # environment; the password, useless without it, into the job's. Both stay masked.
      - name: Signing key without stray line breaks
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          key="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          password="$(printf '%s' "$PASSWORD" | tr -d '\r\n')"
          if [ -n "$key" ]; then echo "::add-mask::$key"; fi
          if [ -n "$password" ]; then echo "::add-mask::$password"; fi
          umask 077
          printf '%s' "$key" > "$RUNNER_TEMP/telex-signing.key"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      # The bundler only warns when the private key doesn't match the public one, and every
      # installed Telex would refuse such a release. Fail here instead, before the build.
      - name: Check the signing key pair
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/telex-signing.key
        run: node scripts/check-signing-key.mjs

      # The bundler makes the updater files only with plugins.updater.pubkey in the config. The
      # key isn't kept in the repository, so this file is written here (it is in .gitignore).
      - name: Updater settings for the bundler
        shell: bash
        run: >-
          node -e "require('fs').writeFileSync('src-tauri/tauri.updater.conf.json',
          JSON.stringify({plugins: {updater: {pubkey: process.env.TELEX_UPDATER_PUBKEY.trim()}}}))"

      # The key's file from above; its password from the job environment.
      # Windows builds nsis and msi (tauri.conf.json), Linux appimage and deb
      # (tauri.linux.conf.json, which Tauri adds on Linux by itself). Both upload to the release
      # the draft job made.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ runner.temp }}/telex-signing.key
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          releaseBody: ${{ needs.draft.outputs.notes }}
          # latest.json, which every Telex checks: version, notes, installers and signatures.
          # (tauri-action v1 calls this uploadUpdaterJson; v0 called it includeUpdaterJson.)
          # Its notes come from releaseBody, so every job passes the same.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json --config src-tauri/tauri.updater.conf.json

      - name: Remove the signing key's file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/telex-signing.key"
