name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the code. Actions are pinned to commits (the tag in a comment): a tag moved
# later can't change what runs.
permissions:
  contents: read

jobs:
  core:
    name: Core tests and UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable # read from the ref when not pinned
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Every theme meets its WCAG 2.2 contrast level, every text has its Polish, and the help has every key.
      - run: node scripts/check-contrast.mjs
      - run: node scripts/check-i18n.mjs
      - run: node scripts/check-keys.mjs
      # The notices the installers carry list every crate in Cargo.lock with its license.
      - run: node scripts/third-party-notices.mjs --check
      - run: cargo fmt -p telex-core -p telex -p telex-security -- --check
      - run: cargo clippy -p telex-core --all-targets -- -D warnings
      - run: cargo test -p telex-core

  # The app itself on Linux, as the release builds it (ubuntu-22.04). Clippy only, no bundle.
  linux:
    name: Linux app check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable # read from the ref when not pinned
          components: clippy
      # What Tauri 2 builds against on Linux, and D-Bus for the password store (keyring).
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy -p telex --all-targets -- -D warnings

  # The Windows-only code (Windows' spell checker, its languages, Outlook in the registry) is
  # checked and tested here; then the installer is built.
  windows:
    name: Windows checks and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable # read from the ref when not pinned
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: npm ci
      - run: cargo clippy -p telex-core -p telex --all-targets -- -D warnings
      - run: cargo test -p telex-core
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telex-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
