name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests and UI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Every theme meets its WCAG 2.2 contrast level, and every text has its Polish.
      - run: node scripts/check-contrast.mjs
      - run: node scripts/check-i18n.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p telex-core --all-targets -- -D warnings
      - run: cargo test -p telex-core

  # The app itself on Linux, as the release builds it (ubuntu-22.04). Clippy only, no bundle.
  linux:
    name: Linux app check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # What Tauri 2 builds against on Linux, and D-Bus for the password store (keyring).
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p telex --all-targets -- -D warnings

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: telex-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
